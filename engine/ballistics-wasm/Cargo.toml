[package]
name    = "ballistics-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
simd = ["ballistics-engine/simd"]

[dependencies]
ballistics-engine = { path = "../ballistics-core" }
wasm-bindgen      = "0.2"
serde_json        = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"
