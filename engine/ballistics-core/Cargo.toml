[package]
name        = "ballistics-engine"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/dirkharrington/ballistics"
description = "Point-mass external ballistics engine (G1/G7 drag models, RK4 integrator)"

[lib]
crate-type = ["rlib"]

[features]
default = []
simd    = []
ffi     = []

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
