version: 2
updates:
  # Java / Maven dependencies
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java

  # JavaScript / npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    ignore:
      # deepmerge 4.3.1 is the latest available version; no upstream patch exists.
      # It is used only by devDependencies (jest-config, jest-environment-puppeteer)
      # and has no production exposure. Track at GHSA-gcqx-w48m-w2h4; re-evaluate
      # when a patched version is published.
      - dependency-name: deepmerge
        versions: ["4.x"]

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
