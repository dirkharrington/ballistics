name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # cancel superseded PR runs only; never cancel main

jobs:
  # ── Layer change detection ────────────────────────────────────────────────────
  # Downstream jobs gate on these outputs so only affected layers run.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      frontend:  ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            frontend:
              - 'app/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'babel.config.json'
              - 'tsconfig.json'
              - 'vite.config.js'
              - '.github/workflows/ci.yml'

  # ── Frontend build & test ────────────────────────────────────────────────────
  # Required status check — no job-level if:.  Work steps gate on frontend output.
  frontend-build:
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.frontend == 'true'

      - name: Set up Node
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      - name: Cache npm download cache
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      - name: npm audit
        if: needs.changes.outputs.frontend == 'true'
        run: npm audit --audit-level=high

      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build

      - name: Test
        if: needs.changes.outputs.frontend == 'true'
        run: npm test -- --ci

      - name: Upload JS coverage
        if: always() && needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-coverage
          path: coverage/

  # ── CodeQL SAST ──────────────────────────────────────────────────────────────
  # Required status check — no job-level if:.
  # Steps gate on frontend output so the expensive init+analyze only runs for the
  # affected layer.
  #
  # PREREQUISITE — disable GitHub's Default Setup before enabling this workflow:
  #   Settings → Security → Code scanning → Default setup → Disable
  # Running both Default Setup and this advanced workflow at the same time causes
  # SARIF upload conflicts that fail the upload-sarif step.
  codeql:
    name: CodeQL SAST
    needs: [changes]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.frontend == 'true'

      - name: Initialize CodeQL
        if: needs.changes.outputs.frontend == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - 'target/**'

      # JavaScript: CodeQL analyses source files directly — no build needed.

      - name: Perform CodeQL Analysis
        if: needs.changes.outputs.frontend == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}

  # ── Trivy filesystem scan ─────────────────────────────────────────────────────
  # Required status check — no job-level if:.  Work steps gate on frontend changes.
  trivy:
    name: Trivy Filesystem Scan
    needs: [changes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.frontend == 'true'

      - name: Run Trivy filesystem scan
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Pin the misconfig rules bundle so upstream rule additions can't
          # fail unrelated PRs.  Update this digest when upgrading Trivy.
          TRIVY_CHECKS_BUNDLE_REPOSITORY: ghcr.io/aquasecurity/trivy-checks@sha256:ef2d9ad4fce0f933b20a662004d7e55bf200987c180e7f2cd531af631f408bb3
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          version: v0.76.2
          # Skip build output and vendored dependency copies; Trivy already reads
          # the lock files (package-lock.json) for the authoritative list.
          skip-dirs: 'dist,node_modules'

      - name: Upload Trivy SARIF to GitHub Security
        if: |
          always() &&
          needs.changes.outputs.frontend == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
