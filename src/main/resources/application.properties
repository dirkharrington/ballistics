spring.application.name=ballistics-visualizer
spring.config.import=classpath:bullets.yaml
spring.threads.virtual.enabled=true
server.port=8080

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=ballistics-visualizer
# Item 6 — never expose internal health details on the main port
management.endpoint.health.show-details=never

spring.mvc.problemdetails.enabled=true

# HTTP compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/wasm
server.compression.min-response-size=1024

# index.html must not be cached (stale reference breaks after Vite rebuild)
# /assets/* are content-hashed and safe to cache forever — configured in WebConfig
spring.web.resources.add-mappings=false

# CORS — comma-separate multiple origins for staging/prod deployments.
# Override via CORS_ALLOWED_ORIGINS env var without touching source.
# Example: CORS_ALLOWED_ORIGINS=https://app.example.com,https://staging.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# SSE timeout — how long the server holds a streaming compare connection open.
# Override via SSE_TIMEOUT_MS env var for slower networks or proxies.
app.sse.timeout-ms=${SSE_TIMEOUT_MS:30000}

# Physics tables location. Defaults to the bundled classpath resource.
# Override in tests via @TestPropertySource(properties = "app.physics.tables-location=...").
# Not mapped to an env var — not intended for runtime override.
app.physics.tables-location=classpath:physics-tables.yaml

# Maximum request body size in bytes for /api/** requests. Larger bodies → 413.
# A 20-item BatchRequest is < 4 KiB; 64 KiB leaves ~16x headroom.
app.http.max-request-body-bytes=${MAX_REQUEST_BODY_BYTES:65536}

# ── Rate limiting ───────────────────────────────────────────────────────────
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.ratelimit.period=${RATE_LIMIT_PERIOD:1m}
app.ratelimit.single.capacity=${RATE_LIMIT_SINGLE_CAPACITY:120}
app.ratelimit.single.global-capacity=${RATE_LIMIT_SINGLE_GLOBAL_CAPACITY:1200}
app.ratelimit.compare.capacity=${RATE_LIMIT_COMPARE_CAPACITY:30}
app.ratelimit.compare.global-capacity=${RATE_LIMIT_COMPARE_GLOBAL_CAPACITY:300}
app.ratelimit.batch.capacity=${RATE_LIMIT_BATCH_CAPACITY:10}
app.ratelimit.batch.global-capacity=${RATE_LIMIT_BATCH_GLOBAL_CAPACITY:100}
app.ratelimit.client-cache.max-size=${RATE_LIMIT_CLIENT_CACHE_MAX_SIZE:10000}
app.ratelimit.client-cache.expire-after-access=${RATE_LIMIT_CLIENT_CACHE_TTL:2m}
app.ratelimit.ipv6-prefix-length=64

# ── Proxy / XFF handling ────────────────────────────────────────────────────
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:10.0.0.0/8,192.168.0.0/16,169.254.0.0/16,100.64.0.0/10,172.16.0.0/12,127.0.0.0/8,fc00::/7,::1/128,fe80::/10}
